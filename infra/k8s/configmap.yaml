# Determinism contract as environment. EVERY worker pod shares this — any
# mismatch (thread count, model, llama.cpp tag) silently corrupts messages.
# Replace the placeholders (or generate via kustomize/envsubst) before apply.
apiVersion: v1
kind: ConfigMap
metadata:
  name: doublespeak-worker-config
  namespace: doublespeak
data:
  GCP_PROJECT: "REPLACE_PROJECT_ID"
  GCS_BUCKET: "REPLACE_PROJECT_ID-doublespeak-assets"
  GCS_MODEL_OBJECT: "models/Phi-3.5-mini-instruct-Q4_K_M.gguf"
  METEOR_GGUF_PATH: "/models/model.gguf"
  METEOR_GGUF_SHA256: "REPLACE_GGUF_SHA256"
  LLAMA_CPP_TAG: "REPLACE_LLAMA_CPP_TAG"
  # Shared protocol state — must equal the value encoders/decoders use.
  METEOR_NUM_THREADS: "4"
  METEOR_LLM_URL: "http://127.0.0.1:8080"
  # Ingress auth: /internal/run is public (behind the worker HTTPS LB), so
  # require a valid Cloud Tasks OIDC token on every push.
  WORKER_REQUIRE_OIDC: "true"
  # Expected `aud` of that token — MUST equal the front-end's worker_url
  # (-var worker_url on the terraform apply), i.e. https://<worker-host>. The
  # host is the sslip.io name that resolves to the reserved Ingress IP
  # (35.201.65.159 -> 35-201-65-159.sslip.io), matching the managed cert +
  # Ingress host. (Was http://<ip> before TLS; Cloud Tasks won't attach OIDC to
  # a plain-http target, so the audience must be the https:// URL now.)
  WORKER_OIDC_AUDIENCE: "https://REPLACE_WORKER_HOST"
  # Allowed caller identity = the Cloud Tasks invoker SA (Terraform output
  # tasks_invoker_service_account).
  WORKER_OIDC_SA: "doublespeak-tasks-invoker@REPLACE_PROJECT_ID.iam.gserviceaccount.com"
