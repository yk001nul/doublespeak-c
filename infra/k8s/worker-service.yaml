# Service fronting the worker pods, exposed to Cloud Tasks via worker-ingress.yaml
# (external HTTP LB). Stays ClusterIP: the `cloud.google.com/neg` annotation turns
# on container-native load balancing (NEG) so the Ingress LB routes straight to
# the pod on a VPC-native cluster — no NodePort needed. Public exposure is safe
# because /internal/run validates the Cloud Tasks OIDC token (WORKER_REQUIRE_OIDC).
apiVersion: v1
kind: Service
metadata:
  name: doublespeak-worker
  namespace: doublespeak
  labels: { app: doublespeak-worker }
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  selector: { app: doublespeak-worker }
  ports:
    - name: http
      port: 80
      targetPort: 8000
  type: ClusterIP
