name: CI / CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  # ── Build & test (Debug, all platforms) ─────────────────────────────────────
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / GCC
            os: ubuntu-latest
            configure_preset: linux-debug
            build_preset: linux-debug-build
            test_preset: linux-debug-test

          - name: Linux / Clang
            os: ubuntu-latest
            configure_preset: linux-debug
            build_preset: linux-debug-build
            test_preset: linux-debug-test
            extra_cmake: -DCMAKE_C_COMPILER=clang

          - name: Windows
            os: windows-latest
            configure_preset: x64-debug-vcpkg
            build_preset: x64-debug-vcpkg-build
            test_preset: x64-debug-vcpkg-test                        
            artifact: meteor-windows-x64

          - name: macOS
            os: macos-latest
            configure_preset: macos-debug
            build_preset: macos-debug-build
            test_preset: macos-debug-test

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsodium-dev libcurl4-openssl-dev libhyphen-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install ninja libsodium curl pkg-config
          brew install libhyphen || brew install hyphen || echo "libhyphen not available (optional)"

          # Make Homebrew paths available to later steps (Apple Silicon default /opt/homebrew)
          echo "PKG_CONFIG_PATH=/opt/homebrew/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=/opt/homebrew:${CMAKE_PREFIX_PATH:-}" >> $GITHUB_ENV
          echo "LDFLAGS=-L/opt/homebrew/lib ${LDFLAGS:-}" >> $GITHUB_ENV
          echo "CPPFLAGS=-I/opt/homebrew/include ${CPPFLAGS:-}" >> $GITHUB_ENV

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Clone and bootstrap vcpkg in the workspace (ensures vcpkg is present)
          git clone https://github.com/microsoft/vcpkg.git vcpkg
          .\vcpkg\bootstrap-vcpkg.bat
      
          # Install curl for x64-windows triplet
          .\vcpkg\vcpkg.exe install curl:x64-windows
      
          # Optional: integrate (useful for Visual Studio)
          .\vcpkg\vcpkg.exe integrate install
          
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Platform-specific Configure for the build job
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          echo "--- Configure (Windows) ---"
          
          # Construct the toolchain path robustly
          $toolchain = Join-Path $env:GITHUB_WORKSPACE 'vcpkg\scripts\buildsystems\vcpkg.cmake'
          Write-Host "Using toolchain: $toolchain"
          
          if (-not (Test-Path $toolchain)) {
            Write-Host "Toolchain not found. Listing vcpkg directory:"
            Get-ChildItem -Path $env:GITHUB_WORKSPACE\vcpkg -Recurse -ErrorAction SilentlyContinue | Select-Object -First 20
            Write-Error "vcpkg toolchain file not found"
            exit 1
          }
      
          cmake --preset ${{ matrix.configure_preset }} `
            -S meteor_stego `
            -B meteor_stego/out/build/${{ matrix.configure_preset }} `
            -DCMAKE_MAKE_PROGRAM=ninja `
            -DMETEOR_USE_LIBHYPHEN=OFF `
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain"

      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          echo "--- Configure (Linux/macOS) ---"
          ls -la $VCPKG_ROOT || true
          cmake --preset ${{ matrix.configure_preset }} \
            -S meteor_stego \
            -B meteor_stego/out/build/${{ matrix.configure_preset }} \
            -DCMAKE_MAKE_PROGRAM=ninja \
            -DMETEOR_USE_LIBHYPHEN=OFF \
            ${{ matrix.extra_cmake || '' }}
          
      - name: Build
        working-directory: meteor_stego
        run: cmake --build --preset ${{ matrix.build_preset }} --parallel

      - name: Test
        # roundtrip and determinism tests emit "llama-server not reachable" and
        # are automatically marked SKIP via SKIP_REGULAR_EXPRESSION — no server
        # or exclusion flags needed.
        if: ${{ matrix.test_preset != '' }}
        working-directory: meteor_stego
        run: ctest --preset ${{ matrix.test_preset }} --output-on-failure

  # ── Release builds (tags only) ──────────────────────────────────────────────
  build-release:
    name: Release ${{ matrix.name }}
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            configure_preset: linux-release
            build_preset: linux-release-build
            artifact: meteor-linux-x64

          - name: Windows
            os: windows-latest
            configure_preset: x64-release-vcpkg
            build_preset: x64-release-vcpkg-build
            artifact: meteor-windows-x64
            extra_cmake: "-DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"

          - name: macOS
            os: macos-latest
            configure_preset: macos-release
            build_preset: macos-release-build
            artifact: meteor-macos

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsodium-dev libcurl4-openssl-dev libhyphen-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja libsodium curl
          brew install libhyphen || brew install hyphen || echo "libhyphen not available (optional)"

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git vcpkg
          .\vcpkg\bootstrap-vcpkg.bat
          .\vcpkg\vcpkg.exe integrate install

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: >
          cmake --preset ${{ matrix.configure_preset }}
          -S meteor_stego
          -B meteor_stego/out/build/${{ matrix.configure_preset }}
          -DCMAKE_MAKE_PROGRAM=ninja
          -DMETEOR_USE_LIBHYPHEN=OFF
          ${{ matrix.extra_cmake || '' }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          echo "--- Configure (Windows) ---"
          echo "GITHUB_WORKSPACE = $env:GITHUB_WORKSPACE"
          echo "VCPKG_ROOT = $env:VCPKG_ROOT"
          Write-Host "Listing vcpkg buildsystems directory (if present):"
          if (Test-Path -Path "$env:GITHUB_WORKSPACE\\vcpkg\\scripts\\buildsystems") {
            Get-ChildItem -Path "$env:GITHUB_WORKSPACE\\vcpkg\\scripts\\buildsystems" -Recurse
          } else {
            Write-Host "vcpkg buildsystems directory not found"
          }
      
          # Build and check the vcpkg toolchain path robustly
          $toolchain = Join-Path $env:GITHUB_WORKSPACE 'vcpkg\scripts\buildsystems\vcpkg.cmake'
          Write-Host "Expecting vcpkg toolchain at: $toolchain"
          if (-not (Test-Path $toolchain)) {
            Write-Host "Directory listing for vcpkg/scripts/buildsystems:"
            if (Test-Path (Join-Path $env:GITHUB_WORKSPACE 'vcpkg\scripts\buildsystems')) {
              Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'vcpkg\scripts\buildsystems') -Recurse | ForEach-Object { Write-Host $_.FullName }
            } else {
              Write-Host "vcpkg/scripts/buildsystems not found"
            }
            Write-Error "vcpkg toolchain file not found at $toolchain"
            exit 1
          }
      
          cmake --preset ${{ matrix.configure_preset }} `
            -S meteor_stego `
            -B meteor_stego/out/build/${{ matrix.configure_preset }} `
            -DCMAKE_MAKE_PROGRAM=ninja `
            -DMETEOR_USE_LIBHYPHEN=OFF `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain"

      - name: Build
        working-directory: meteor_stego
        run: cmake --build --preset ${{ matrix.build_preset }} --parallel

      - name: Stage artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-staging
          $dir = "meteor_stego\out\build\${{ matrix.configure_preset }}"
          Copy-Item "$dir\meteor.dll"  release-staging\
          Copy-Item "$dir\meteor.lib"  release-staging\ -ErrorAction SilentlyContinue
          Copy-Item "meteor_stego\include\meteor.h" release-staging\

      - name: Stage artifacts (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p release-staging
          cp meteor_stego/out/build/${{ matrix.configure_preset }}/libmeteor.* release-staging/
          cp meteor_stego/include/meteor.h release-staging/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-staging/
          retention-days: 7

  # ── GitHub Release (tags only) ──────────────────────────────────────────────
  publish:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            meteor-linux-x64/**
            meteor-windows-x64/**
            meteor-macos/**
          draft: false
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
